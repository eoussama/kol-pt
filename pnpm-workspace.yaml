allowBuilds:
  "@firebase/util": true
  "@parcel/watcher": true
  esbuild: true
  protobufjs: true

overrides:
  # Firestore (unused, but part of the `firebase` package) pins an old gRPC
  # stack that is only used by its Node build. Force the patched releases.
  "@grpc/grpc-js": ^1.14.5
  # @wxt-dev/module-react accepts v4-v6; keep a single copy that supports Vite 8.
  "@vitejs/plugin-react": ^6.1.1
  protobufjs: ^7.6.5
