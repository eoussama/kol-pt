name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Audit, lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  build:
    name: Build and zip for every browser
    needs: check
    runs-on: ubuntu-latest
    env:
      ENV_PROD: ${{ secrets.ENV_PROD }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The secret may still use the old REACT_APP_ prefix; both work.
      - name: Write .env
        if: env.ENV_PROD != ''
        run: printf '%s\n' "$ENV_PROD" | sed 's/^REACT_APP_/WXT_/' > .env

      - run: pnpm zip:all

      # Pull requests from forks get no secrets: their builds have no Firebase
      # configuration and are not worth keeping.
      - uses: actions/upload-artifact@v7
        if: env.ENV_PROD != ''
        with:
          name: kol-pt-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
