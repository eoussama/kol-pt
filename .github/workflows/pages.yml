name: Landing page

# Publishes the landing page in site/ to GitHub Pages after each release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, without cancelling one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: pages
        uses: actions/configure-pages@v5

      - run: node site/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
